name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # O CI roda contra fixtures versionadas, nao contra a pagina da Anvisa.
      # A pagina serve so a competencia vigente e muda o nome do arquivo a cada
      # publicacao -- um push nao pode quebrar porque um orgao republicou algo.
      # A disponibilidade da fonte e checada pelo workflow `fonte` (agendado).
      - name: pipeline completo sobre as fixtures
        env:
          CMED_RAW_DIR: tests/fixtures
        run: python run.py --skip-report

      - name: publicar resultado dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: transform/target/
          if-no-files-found: ignore
